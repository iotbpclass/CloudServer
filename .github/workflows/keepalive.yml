# 自动工程实作课 · 防止 Supabase 闲置被暂停
# 每 3 天自动碰一下 Supabase（也可以在 GitHub → Actions → 这个工作 → Run workflow 手动跑）
name: keep-supabase-awake

on:
  schedule:
    - cron: "23 1 */3 * *"   # 每 3 天，马来西亚时间早上 9:23
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          code=$(curl -s -o /tmp/out.txt -w "%{http_code}" -X POST \
            "https://tqotlmqqutcklnvrqoom.supabase.co/rest/v1/rpc/ping" \
            -H "apikey: sb_publishable_S5gWWI3h-5G7eKaFEt82rA_iFQcicu4" \
            -H "Content-Type: application/json" -d '{}')
          cat /tmp/out.txt; echo
          echo "HTTP $code"
          test "$code" = "200"
